# One-shot relay for restoring a current-branch DOS build after connected
# GitHub writes failed to generate push-triggered runs. Remove when complete.
name: One-shot current DOS build dispatch
on:
  workflow_run:
    workflows: ['Native DOS Tandy and VGA prototype']
    types: [completed]
permissions:
  actions: write
jobs:
  dispatch_current_dos:
    # Only the explicitly retried November 7 failed workflow may dispatch.
    # Other historic/current runs are ignored; no recursive build loop.
    if: ${{ github.event.workflow_run.id == 42422798202 }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch latest DOS branch (not the old run's SHA)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run dos-tandy.yml --repo "$GITHUB_REPOSITORY" --ref dos/tandy-native-prototype
