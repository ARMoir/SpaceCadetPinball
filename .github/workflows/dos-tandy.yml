name: Native DOS Tandy and VGA prototype
on:
  push:
    paths: ['Platform/dos/**', '.github/workflows/dos-tandy.yml']
  pull_request:
    paths: ['Platform/dos/**', '.github/workflows/dos-tandy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dos:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pinned portable tools
        id: tools
        uses: actions/cache@v4
        with:
          path: .dos-tools
          key: dos-tools-watcom-2026-11-01-dosbox-x-2026-10-01-v1
      - name: Fetch and verify tools
        if: steps.tools.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .dos-tools | Out-Null
          Invoke-WebRequest 'https://github.com/open-watcom/open-watcom-v2/releases/download/2026-11-01-Build/open-watcom-2_0-c-win-x64.exe' -OutFile .dos-tools/watcom.exe
          if ((Get-FileHash .dos-tools/watcom.exe).Hash -ne 'D4E496C593EF2ACBC54D1EAEB31B31D9C62F86E39A09E61ADA411EF34FEAA01A') { throw 'Watcom hash mismatch' }
          python -c "import zipfile; zipfile.ZipFile('.dos-tools/watcom.exe').extractall('.dos-tools/watcom')"
          Invoke-WebRequest 'https://github.com/joncampbell123/dosbox-x/releases/download/dosbox-x-v2026.10.01/dosbox-x-mingw64-2026.10.01-portable.zip' -OutFile .dos-tools/dosbox.zip
          if ((Get-FileHash .dos-tools/dosbox.zip).Hash -ne 'DEF2D84D4415FC26C77252839B4DAFB6B476E3A4204B896292E6B05505CA8C59') { throw 'DOSBox-X hash mismatch' }
          Expand-Archive .dos-tools/dosbox.zip .dos-tools/dosbox
      - name: Test converter and build 8086 binaries
        shell: pwsh
        run: |
          $env:WATCOM=(Resolve-Path .dos-tools/watcom).Path
          python Platform/dos/test_convert.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/test_run_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/test_source_layout.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/test_analyze_logs.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/test_menu_font.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/test_menu_art.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/test_video_modes.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/test_enhance_table.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/verify_vga_art.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/test_vga_art.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/test_package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/build.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/verify_build.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item Platform/dos/data/TABLE.DAT,Platform/dos/data/TABLE.TGA,Platform/dos/data/IMPORT.json,Platform/dos/data/PREVIEW.png,Platform/dos/data/VGA.DAT build/dos/
          python Platform/dos/enhance_table.py --table build/dos/TABLE.TGA --pack build/dos/TABLE.DAT --output build/dos/TABLE3D.TGA --preview build/dos/PREVIEW3D.png
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-Item build/dos/TABLE3D.TGA).Length -ne 32768) { throw 'Wrong enhanced artwork size' }
      - name: Run Tandy09 and VGA13 DOS gameplay, video and parity tests
        shell: pwsh
        run: |
          $emu='.dos-tools/dosbox/mingw-build/mingw-sdl2/dosbox-x.exe'
          # Old 7 MHz target remains the baseline, with BIOS auto-select.
          python Platform/dos/run_tests.py --emulator $emu --original --video tandy --auto-video
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build/dos/RUN_SUMMARY.TXT build/dos/RUN_TANDY_AUTO_SUMMARY.TXT
          # Verify the explicit /tandy override on a Tandy BIOS as well.
          python Platform/dos/run_tests.py --emulator $emu --original --video tandy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build/dos/RUN_SUMMARY.TXT build/dos/RUN_TANDY_SUMMARY.TXT
          # Standard VGA machines must support both explicit and auto mode.
          python Platform/dos/run_tests.py --emulator $emu --original --video vga --rgbi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build/dos/RUN_SUMMARY.TXT build/dos/RUN_VGA_SUMMARY.TXT
          python Platform/dos/verify_video_modes.py build/dos
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python Platform/dos/run_tests.py --emulator $emu --original --video vga --auto-video --rgbi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build/dos/RUN_SUMMARY.TXT build/dos/RUN_VGA_AUTO_SUMMARY.TXT
          python Platform/dos/verify_video_modes.py build/dos
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify source-color VGA graphics and gameplay
        shell: pwsh
        run: |
          python Platform/dos/run_tests.py --emulator .dos-tools/dosbox/mingw-build/mingw-sdl2/dosbox-x.exe --original --video vga --auto-video
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build/dos/RUN_SUMMARY.TXT build/dos/RUN_VGA_COLOR_SUMMARY.TXT
          python Platform/dos/verify_vga_art.py --runs build/dos
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package runtime files only
        shell: pwsh
        run: python Platform/dos/package.py
      - name: Upload playable CADET.zip
        uses: actions/upload-artifact@v4
        with:
          name: CADET
          path: build/package/runtime/*
          if-no-files-found: error
      - name: Upload validation evidence separately
        uses: actions/upload-artifact@v4
        with:
          name: CADET-VALIDATION
          path: |
            build/dos/*.LOG
            build/dos/*.MAP
            build/dos/*SUMMARY.TXT
            build/dos/TEST.OK
            build/dos/SMOKE.TXT
            build/dos/SCREEN-*.BIN
            build/dos/*.png
      - name: Upload failed-build diagnostic logs (not a playable CADET.zip)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CADET-DIAGNOSTICS
          if-no-files-found: warn
          path: |
            build/dos/*.LOG
            build/dos/*.MAP
            build/dos/RUN_SUMMARY.TXT
            build/dos/TEST.OK
            build/dos/SMOKE.TXT

  publish:
    needs: dos
    if: github.ref == 'refs/heads/dos/tandy-native-prototype' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CADET
          path: runtime
      - name: Create release archive
        working-directory: runtime
        run: zip -9 ../CADET.zip CADET.EXE TABLE.DAT TABLE.TGA TABLE3D.TGA VGA.DAT MENU.DAT
      - name: Publish tested prototype build
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = `dos-build-${context.runNumber}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const {data: release} = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `DOS Space Cadet build ${context.runNumber}`,
              prerelease: true,
              draft: true,
              body: `Tested DOS/Tandy and VGA prototype from ${context.sha}.\n\nDownload CADET.zip and extract all six files together. Run CADET.EXE from that directory. SCORES.DAT is created locally; preserve your existing scores when updating.\n\nOriginal assets with simplified physics/rules; real V20 timing remains unverified. Validation logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo,
              release_id: release.id,
              name: 'CADET.zip',
              data: fs.readFileSync('CADET.zip'),
              headers: {'content-type': 'application/zip'}
            });
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, draft: false
            });
            await core.summary.addLink('Download published build', release.html_url).write();
